<div class="body d-flex gap-3">
  <mat-card>
    <div class="bg-header">
      <mat-card-title>Member Demograhics</mat-card-title>
      <mat-card-header>Patient Primary Information</mat-card-header>
    </div>
        <hr>
    <app-member-demo ></app-member-demo>
  </mat-card>
  
  <mat-card>
    <div class="bg-header justify-content-between d-flex">
      <div>
        <mat-card-title>Assessment</mat-card-title>
        <mat-card-header>Assessment Details</mat-card-header>
      </div>
      <div class="d-flex">
        <button type="button" class="btn-view-assessment gap-1" (click)="openViewAssessment()">
          <mat-icon class="icon-view-btn">assessment</mat-icon> View Assessment
        </button>
      </div>
    </div>
    <hr>
    <app-assessment-details></app-assessment-details>
  </mat-card>
</div>

<div class="body">
  <mat-card class="care-mang">
    <div class="bg-header d-flex justify-content-between">
      <div>
        <mat-card-title>Enhanced Care Management</mat-card-title>
        <mat-card-subtitle *ngIf="calledFrom === 'ML'">Care Plan Generated using ML</mat-card-subtitle>
        <mat-card-subtitle *ngIf="calledFrom === 'LLM'">Care Plan Generated using LLM</mat-card-subtitle>
      </div>

      <div class="d-flex gap-1">
        <button type="button" class="btn-add">
          <mat-icon class="icon-add-btn" (click)="opeCaseDialog()">add</mat-icon>
        </button>
      </div>
    </div>
    <hr>
    <app-care-management></app-care-management>
  </mat-card>
</div>

<div class="body d-flex gap-3">
  <mat-card class="card-prob">
    <div class="bg-header d-flex justify-content-between">
      <mat-card-title>Problems</mat-card-title>
      <div class="d-flex gap-1">
        <button type="button" class="btn-add" (click)="opeProblemDialog()" [disabled]="!(hasCaseName$ | async)">
          <mat-icon class="icon-add-btn">edit</mat-icon>
        </button>
        
      </div>
    </div>
    <hr>
        <app-case-problems></app-case-problems>
  </mat-card >
  <mat-card class="card-prob">
    <div class="bg-header d-flex justify-content-between">
      <mat-card-title>Goals</mat-card-title>
      <div class="d-flex gap-1">
        <button type="button" class="btn-add" (click)="opeGoalDialog()" [disabled]="!(hasProblems$ | async)">
          <mat-icon class="icon-add-btn">edit</mat-icon>
        </button>       
      </div>
    </div>
    <hr>
        <app-case-goals></app-case-goals>
  </mat-card>
  <mat-card class="card-prob">
    <div class="bg-header d-flex justify-content-between">
      <mat-card-title>Milestones</mat-card-title>
      <div class="d-flex gap-1">
        <button type="button" class="btn-add" (click)="opeMilestoneDialog()" [disabled]="!(hasGoal$ | async)">
          <mat-icon class="icon-add-btn">edit
          </mat-icon>
        </button>
        
      </div>
    </div>
    <hr>
        <app-case-milestones></app-case-milestones>
  </mat-card>
</div>
<div class="btn-submit">
  <button type="button" class="btn-submitPlan" [disabled]="!(hasMilestone$ | async)" (click)="OnSubmit()">
    Submit Plan
  </button>
</div>
