<h2 mat-dialog-title>Add Goal</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="goalForm" class="d-flex flex-column">
    <mat-form-field appearance="fill">
      <input
        type="text"
        placeholder="Problem"
        matInput
        [matAutocomplete]="auto1"
        formControlName="problem"
        (input)="onInput($event)"
      />
      <mat-autocomplete #auto1="matAutocomplete" (optionSelected)="onProblemSelected($event)">
        <mat-option *ngFor="let val1 of filteredProblem" [value]="val1">
          {{ val1 }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <input
        type="text"
        placeholder="Goal"
        matInput
        [matAutocomplete]="auto2"
        formControlName="goal"
        (input)="onInputGoal($event)"
      />
      <mat-autocomplete #auto2="matAutocomplete">
        <mat-option *ngFor="let val1 of filteredgoals; let isLast = last" [value]="val1">
          {{ val1 }}
          <div *ngIf="!isLast" class="border-b border-gray-300"></div>
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <input
        type="text"
        placeholder="Status"
        matInput
        [matAutocomplete]="auto3"
        formControlName="status"
        (input)="onInputStatus($event)"
      />
      <mat-autocomplete #auto3="matAutocomplete">
        <mat-option *ngFor="let val1 of filteredStatus" [value]="val1">
          {{ val1 }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <input
        type="text"
        placeholder="Priority"
        matInput
        [matAutocomplete]="auto4"
        formControlName="priority"
        (input)="onInputPriority($event)"
      />
      <mat-autocomplete #auto4="matAutocomplete">
        <mat-option *ngFor="let val1 of filteredpriorities" [value]="val1">
          {{ val1 }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Start Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="startDate" />
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Close Date</mat-label>
      <input matInput [matDatepicker]="picker2" formControlName="endDate" />
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
      <mat-datepicker #picker2></mat-datepicker>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="mt-4 mb-4">
  <button mat-stroked-button mat-dialog-close>Close</button>
  <button color="primary" mat-flat-button [disabled]="!goalForm.valid" (click)="OnSaveGoal()" [mat-dialog-close]="true" cdkFocusInitial>Save</button>
</mat-dialog-actions>
