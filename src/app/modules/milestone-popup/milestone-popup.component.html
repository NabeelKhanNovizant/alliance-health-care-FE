<h2 mat-dialog-title>Add Milestone</h2>

<mat-dialog-content class="mat-typography">

    <div class="d-flex flex-column">

    <mat-form-field appearance="fill">
      <mat-label>Problem</mat-label>

        <input
        type="text"
        placeholder="Problem"
        matInput
        [matAutocomplete]="auto1"
        [(ngModel)]="selectedProblem"
        name="problem"
        required
        (input)="onInput($event)"
        />
        <mat-autocomplete #auto1="matAutocomplete" (optionSelected)="onProblemSelected($event)">
          <mat-option *ngFor="let val1 of filteredProblem" [value]="val1">
            {{ val1 }}
          </mat-option>
        </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="fill" class="expandable-field">
      <mat-label>Goal</mat-label>
      <textarea
        placeholder="Goal"
        matInput
        [matAutocomplete]="auto2"
        [(ngModel)]="selectedgoal"
        name="goal"
        required
        (input)="onInputGoal($event)"
        rows="3"
      ></textarea>
      <mat-autocomplete #auto2="matAutocomplete" (optionSelected)="onGoalSelected($event)">
        <mat-option *ngFor="let val1 of filteredgoals; let isLast = last  " [value]="val1">
          {{ val1 }}
          <div *ngIf="!isLast" class="border-b border-gray-300"></div>
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>
    

    <mat-form-field appearance="fill">
      <mat-label>Milestone</mat-label>
      <textarea
        placeholder="Milestone"
        matInput
        [matAutocomplete]="auto8"
        [(ngModel)]="selectedmilestones"
        name="milestone"
        required
        (input)="onInput($event)"
        rows="3"
      ></textarea>
      <mat-autocomplete #auto8="matAutocomplete">
        <mat-option *ngFor="let val1 of filteredmilestones; let isLast = last " [value]="val1">
          {{ val1 }}
          <div *ngIf="!isLast" class="border-b border-gray-300"></div>
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    
    <mat-form-field appearance="fill">
      <mat-label>Status</mat-label>
        <input
        type="text"
        placeholder="Status"
        matInput
        [matAutocomplete]="auto3"
        [(ngModel)]="selectedStatu"
        name="status"
        required
        (input)="onInputStatus($event)"
        />
        <mat-autocomplete #auto3="matAutocomplete">
          <mat-option *ngFor="let val1 of filteredStatus" [value]="val1">
            {{ val1 }}
          </mat-option>
        </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Action Type</mat-label>
        <input
        type="text"
        placeholder="Action Type"
        matInput
        [matAutocomplete]="auto4"
        [(ngModel)]="selectedActionType"
        name="actiontype"
        required
        (input)="onInputActionType($event)"
        />
        <mat-autocomplete #auto4="matAutocomplete">
          <mat-option *ngFor="let val1 of filteredActionType" [value]="val1">
            {{ val1 }}
          </mat-option>
        </mat-autocomplete>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Start Date</mat-label>
      <input matInput [matDatepicker]="picker"  [(ngModel)]="startDate" required>
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Close Date</mat-label>
      <input matInput [matDatepicker]="picker2"  [(ngModel)]="endDate" required>
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
      <mat-datepicker #picker2></mat-datepicker>
    </mat-form-field>

    </div>
</mat-dialog-content>
<mat-dialog-actions align="end" class="mt-4 mb-4">
  <button mat-stroked-button mat-dialog-close>Close</button>
  <button 
    color="primary" 
    mat-flat-button 
    [mat-dialog-close]="true" 
    (click)="OnSaveMilestone()" 
    [disabled]="!formIsValid" 
    cdkFocusInitial
  >
    Save
  </button>
</mat-dialog-actions>
